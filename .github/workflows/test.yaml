name: test
on:
  push:
    paths-ignore:
      - LICENSE
      - README.*
      - examples
  pull_request:
    paths-ignore:
      - LICENSE
      - README.*
      - examples
jobs:
  nim:
    name: nim tests
    uses: nimbase/setup-nim-action/.github/workflows/test.yml@main
    with:
      nim-version: '2.2.x'
      os: '[{"os":"ubuntu-latest"},{"os":"macos-latest"}]'
      pre-test-command: |
        clue install --depsOnly &&
        mkdir -p bin &&
        clue build src/denim.nim -o:bin/denim

